name: ChaosMesh Sentinel CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ChaosMesh Unit Tests & Resilience Verifications
        run: node tests/chaosmesh.test.js
